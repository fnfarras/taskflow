name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'taskflow-api/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'taskflow-api/**'
      - '.github/workflows/tests.yml'

jobs:
  test:
    name: PHP ${{ matrix.php }} — Laravel Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.2', '8.3']

    defaults:
      run:
        working-directory: taskflow-api

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Setup PHP + extensions
      # -----------------------------------------------------------------------
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 3. Cache Composer dependencies
      # -----------------------------------------------------------------------
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles('taskflow-api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php }}-
            ${{ runner.os }}-composer-

      # -----------------------------------------------------------------------
      # 4. Install dependencies
      # -----------------------------------------------------------------------
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # -----------------------------------------------------------------------
      # 5. Setup environment
      # -----------------------------------------------------------------------
      - name: Copy .env.example
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Create SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      # -----------------------------------------------------------------------
      # 6. Run migrations
      # -----------------------------------------------------------------------
      - name: Run database migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/taskflow-api/database/database.sqlite

      # -----------------------------------------------------------------------
      # 7. Run tests dengan Pest
      # -----------------------------------------------------------------------
      - name: Run feature & unit tests
        run: php artisan test --no-coverage
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/taskflow-api/database/database.sqlite
          APP_ENV: testing
